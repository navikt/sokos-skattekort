version: 2
registries:
  nav-maven:
    type: maven-repository
    url: https://github-package-registry-mirror.gc.nav.no/cached/maven-release
    username: x-access-token
    password: no-secret-required

updates:
  - package-ecosystem: gradle
    directory: "/"
    registries:
      - nav-maven
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Europe/Oslo"
    cooldown:
      default-days: 7
    groups:
      kotlin-plugins:
        patterns:
          - "jvm"
          - "plugin.serialization"
      ktor:
        patterns:
          - "io.ktor:*"
        update-types:
          - minor
          - patch
      gradle-minor-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "jvm"
          - "plugin.serialization"
          - "io.ktor:*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Europe/Oslo"
    groups:
      github:
        patterns:
           - "*"