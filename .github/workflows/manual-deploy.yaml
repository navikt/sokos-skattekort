name: Deploy application manually

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - dev
          - q1
          - q2
          - qx

env:
  TZ: Europe/Oslo

jobs:
  build-and-test:
    permissions:
      contents: read
    name: Build and test
    uses: navikt/mob-gha-workflows/.github/workflows/gradle-build-test-app.yaml@main
    with:
      upload-artifact: true

  build-push-image-dev:
    permissions:
      contents: read
      id-token: write
    needs: [build-and-test]
    name: Build push dev image
    uses: navikt/mob-gha-workflows/.github/workflows/gradle-build-push-image.yaml@main
    secrets: inherit
    with:
      image-suffix: "dev"
      image-tag: 'snapshot'
      dockerfile: "./.nais/dev/Dockerfile"
      use-artifact: true

  deploy-dev-q2:
    if: ${{ inputs.environment == 'dev' || inputs.environment == 'q2' }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    needs: [build-push-image-dev]
    name: Deploy to dev-gcp-q2
    uses: navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@main
    with:
      cluster: dev-gcp
      resource: .nais/dev/naiserator-q2.yaml
      image: ${{ needs.build-push-image-dev.outputs.image }}

  deploy-dev-q1:
    if: ${{ inputs.environment == 'dev' || inputs.environment == 'q1' }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    needs: [build-push-image-dev, deploy-dev-q2]
    name: Deploy to dev-gcp-q1
    uses: navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@main
    with:
      cluster: dev-gcp
      resource: .nais/dev/naiserator-q1.yaml
      image: ${{ needs.build-push-image-dev.outputs.image }}

  deploy-dev-qx:
    if: ${{ inputs.environment == 'qx' }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    needs: [build-push-image-dev]
    name: Deploy to dev-gcp-qx
    uses: navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@main
    with:
      cluster: dev-gcp
      resource: .nais/dev/naiserator-qx.yaml
      image: ${{ needs.build-push-image-dev.outputs.image }}