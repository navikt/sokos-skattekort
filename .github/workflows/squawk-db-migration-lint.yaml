name: Squawk DB migration lint
on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/main/resources/db/migration/*.sql'

jobs:
  squawk-db-migration-lint:
    permissions:
      contents: read
      pull-requests: write
    name: Run DB migration lint
