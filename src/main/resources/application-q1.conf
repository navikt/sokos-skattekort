application {
    appName = "sokos-skattekort"
    appName = ${?NAIS_APP_NAME}
    podName = "notinnais"
    podName = ${?NAIS_POD_NAME}
    profile = Q1
    gyldigeFnr = "KUNSTIGE_FNR"
    bestillingOrgnr = "312978083"
    mqListenerEnabled = true
}

azureAd {
    clientId = ${?AZURE_APP_CLIENT_ID}
    wellKnownUrl = ${?AZURE_APP_WELL_KNOWN_URL}
    tenantId = ${?AZURE_APP_TENANT_ID}
    clientSecret = ${?AZURE_APP_CLIENT_SECRET}
    providerName = "azureAd"
}

postgres {
    jdbcUrl = ${?DB_JDBC_URL}
    name = "sokos-skattekort"
    name = ${?DB_DATABASE}
    host = "localhost"
    host = ${?DB_HOST}
    port = "5432"
    port = ${?DB_PORT}
    username = ${?DB_USERNAME}
    password = ${?DB_PASSWORD}
}

mq {
    hostname = "mqls02.preprod.local"
    port = 1413
    queueManagerName = "MQLS02"
    channelName = "Q1_SKATTEKORT"
    serviceUsername = ${?MQ_SERVICE_USERNAME}
    servicePassword = ${?MQ_SERVICE_PASSWORD}
    userAuth = true
    fraForSystemQueue = "QA.Q1_SKATTEKORT.FRA_FORSYSTEM"
    leveransekoeOppdragZSkattekort = "QA.Q1_231.OB04_SKATTEKORT"
    leveransekoeOppdragZSkattekortStor = "QA.Q1_231.OB04_SKATTEKORT_STOR"
}

scheduler {
    enabled = true
    cronBestilling = "*/5 * * * * *"
    cronUtsending = "20 * * * * *"
    cronHentSkattekort = "10 * * * * *"
    cronHentOppdaterte = "45 */30 * * * *"
    cronFetchMetrics = "50 0/10 * * * *"
    cronDeleteSkattekort = "0 0 0 15 1 *"
}

maskinporten {
    clientId = ${?MASKINPORTEN_CLIENT_ID}
    wellKnownUrl = ${?MASKINPORTEN_WELL_KNOWN_URL}
    rsaKeyString = ${?MASKINPORTEN_CLIENT_JWK}
    scopes = ${?MASKINPORTEN_SCOPES}
    systemBrukerClaim = "312978083"
}

skatteetaten {
    skatteetatenUrl = "https://api-test.sits.no"
}

darePoc {
    darePocUrl = "http://sokos-dare-poc"
    darePocScope = "api://dev-gcp.okonomi.sokos-dare-poc/.default"
}

kafka {
    enabled = true
    topic = "pdl.leesah-v1"
    consumerGroupId = "sokos-skattekort-group-id"
    offsetReset = "earliest"
    brokers = ${?KAFKA_BROKERS}
    schemaRegistry = ${?KAFKA_SCHEMA_REGISTRY}
    schemaRegistryUser = ${?KAFKA_SCHEMA_REGISTRY_USER}
    schemaRegistryPassword = ${?KAFKA_SCHEMA_REGISTRY_PASSWORD}
    truststorePath = ${?KAFKA_TRUSTSTORE_PATH}
    credstorePassword = ${?KAFKA_CREDSTORE_PASSWORD}
    keystorePath = ${?KAFKA_KEYSTORE_PATH}
}

pdl {
    pdlUrl = "https://pdl-api-q1.dev-fss-pub.nais.io"
    pdlScope = "api://dev-fss.pdl.pdl-api-q1/.default"
}

tilgangsmaskin {
    tilgangsmaskinUrl = "http://populasjonstilgangskontroll.tilgangsmaskin"
    tilgangsmaskinScope = "api://dev-gcp.tilgangsmaskin.populasjonstilgangskontroll/.default"
}

unleash {
    unleashApi = ${?UNLEASH_SERVER_API_URL}
    apiKey = ${?UNLEASH_SERVER_API_TOKEN}
    environment = ${?UNLEASH_SERVER_API_ENV}
}
