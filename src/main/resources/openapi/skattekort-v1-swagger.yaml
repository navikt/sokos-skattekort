openapi: 3.0.3
info:
  title: sokos-skattekort API
  description: |-
    API-tjeneste for å søke eller bestille etter skattekort
  termsOfService: https://swagger.io/terms/
  contact:
    name: Team Motta og Beregne
    email: okonomi@nav.no
    url: https://nav-it.slack.com/archives/CKZADNFBP
  version: 1.0.0
servers:
  - url: /api/v1/skattekort
tags:
  - name: sokos-skattekort
    description: API for å håndtere skattekort-forespørsler
paths:
  /bestille:
    post:
      tags:
        - skattekort
      summary: Bestille skattekort
      description: Bekrefte henting av skattekort
      operationId: taImotForespoeresel
      requestBody:
        description: Send forespørsel om skattekort
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForespoerselRequest'
        required: true
      responses:
        '201':
          description: Opprettet forespørsel suksess
        '400':
          description: Ugyldig request, oppfyller ikke swagger-kontrakt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Ingen tilgang
        '500':
          description: Annen feil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        - BearerAuth: [ ]
  /bestillingbulk/{forsystem}/{inntektsaar}:
    post:
      tags:
        - skattekort
      summary: Bestille skattekort i bulk
      description: |
        Oppretter bulkbestilling av skattekort for flere personer.
        Request body skal være tekst der hvert fødselsnummer står på egen linje.
      operationId: bestillingBulk
      parameters:
        - name: forsystem
          in: path
          required: true
          description: Kildesystem for bestillingen
          schema:
            type: string
            example: "OS"
        - name: inntektsaar
          in: path
          required: true
          description: Inntektsåret det bestilles skattekort for
          schema:
            type: integer
            format: int32
            example: 2025
      requestBody:
        required: true
        description: Liste med FNR, ett per linje
        content:
          text/plain:
            schema:
              type: string
              example: |
                01010112345
                02020212345
                03030312345
      responses:
        '202':
          description: Bulkbestilling mottatt
        '400':
          description: Ugyldig request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Ingen tilgang
        '500':
          description: Annen feil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        - BearerAuth: [ ]

  /status:
    post:
      tags:
        - skattekort
      summary: Bestille skattekort
      description: Status om forespørsel
      operationId: statusForespoeresel
      requestBody:
        description: Status om forespørsel
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForespoerselRequest'
        required: true
      responses:
        '200':
          description: Returnerer status
        '400':
          description: Ugyldig request, oppfyller ikke swagger-kontrakt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Ingen tilgang
        '500':
          description: Annen feil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        - BearerAuth: [ ]

components:
  schemas:
    ForespoerselRequest:
      type: object
      properties:
        personIdent:
          type: string
          example: "01010112345"
        aar:
          type: integer
          format: int32
          example: 2025
        forsystem:
          type: string
          example: "MANUELL"
    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: "VENTER_PAA_UTSENDING"
          description: Status for forespørselen
    ApiError:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
          description: Tidspunkt feilen oppsto
        status:
          type: integer
          example: 4xx
          description: HTTP status kode
        error:
          type: string
          example: Bad Request
          description: En kort, lesbar oppsummering av problemet
        message:
          type: string
          example: Det skjedde en feil
          description: En lesbar forklaring som er spesifikk for denne forekomsten av problemet
        path:
          type: string
          example: /api/v1/skattekort/bestille
          description: Endepunktet hvor feilen oppstå

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Paste only the raw token (no "Bearer " prefix). UI will send header:
        Authorization: Bearer <token>