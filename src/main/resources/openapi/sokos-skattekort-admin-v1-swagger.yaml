openapi: '3.0.3'

info:
  version: 1.0.0
  title: sokos-skattekort API
  description: API-tjeneste for admininnsyn i bestillingsbatcher for skattekort
  contact:
    name: PO Utbetaling
    email: okonomi@nav.no
    url: https://nav-it.slack.com/archives/CKZADNFBP
servers:
  - url: /api/v1/admin
tags:
  - name: skattekort-admin
    description: Adminfunksjoner for Skattekort

paths:
  /bestillingsbatcher:
    post:
      tags: [skattekort-admin]
      summary: Hent bestillingsbatcher
      description: Returnerer bestillingsbatcher filtrert på opprettet/oppdatert tidspunkt.
      operationId: hentBestillingsbatcher
      requestBody:
        description: |
          Filter for henting av batcher. Alle felter er valgfrie.
          Hvis ingen filtre oppgis, returneres de 20 siste batchene pluss alle som ikke har status FERDIG.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchInsightRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchInsightResponse'
        400: { $ref: '#/components/responses/BadRequest' }
        401: { description: Ingen tilgang }
        500: { $ref: '#/components/responses/ServerError' }
      security:
        - Bearer: []
    get:
      tags: [ skattekort-admin ]
      summary: Hent uferdige bestillingsbatcher (uten JSON-payloads)
      description: |
        Returnerer alle bestillingsbatcher som ikke har status FERDIG.
      operationId: hentUferdigeBestillingsbatcher
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchInsightResponse'
        401: { description: Ingen tilgang }
        500: { $ref: '#/components/responses/ServerError' }
      security:
        - Bearer: [ ]

  /bestillingsbatcher/{id}:
    patch:
      tags: [ skattekort-admin ]
      summary: Kjør batch på nytt
      description: |
        Setter en batch med status `FEILET` tilbake til `RETRY` slik at den plukkes opp på nytt.
      operationId: rerunBestillingsbatch
      parameters:
        - name: id
          in: path
          required: true
          description: Database-ID for batchen som skal kjøres på nytt
          schema:
            type: integer
            format: int64
            example: 12345
      responses:
        202:
          description: Accepted - rerun startet
          content:
            text/plain:
              schema: { type: string }
              example: 'Oppdaterte 1 batcher'
        400: { $ref: '#/components/responses/BadRequest' }
        401: { description: Ingen tilgang }
        500: { $ref: '#/components/responses/ServerError' }
      security:
        - Bearer: [ ]

  /bestillinger:
    get:
      tags: [skattekort-admin]
      summary: Hent alle bestillinger
      description: Returnerer alle registrerte bestillinger (inkl. både ubehandlede og batch-tilknyttede).
      operationId: hentBestillinger
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BestillingResponse'
        401: { description: Ingen tilgang }
        500: { $ref: '#/components/responses/ServerError' }
      security:
        - Bearer: []

  /utsendinger:
    get:
      tags: [skattekort-admin]
      summary: Hent alle utsendinger
      description: Returnerer alle utsendinger.
      operationId: hentUtsendinger
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtsendingResponse'
        401: { description: Ingen tilgang }
        500: { $ref: '#/components/responses/ServerError' }
      security:
        - Bearer: []

  /auditLogg:
    post:
      tags: [skattekort-admin]
      summary: Hent audit-logg for person
      description: |
        Returnerer audit-logg for oppgitt fødselsnummer.
        Responsen er pakket inn i et `WrappedWithErrorResponse`-objekt:
        - Ved suksess settes `data` til en `AuditResponse` og `errorMessage` er `null`.
        - Ved manglende rettigheter settes `data` til en tom streng og `errorMessage`
          til en forklarende melding (HTTP 200).
      operationId: hentAuditLogg
      requestBody:
        required: true
        description: Fødselsnummer for personen du ønsker audit-logg for
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FnrRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/WrappedAuditResponse'
                  - $ref: '#/components/schemas/WrappedAuditError'
        400: { $ref: '#/components/responses/BadRequest' }
        401: { description: Ingen tilgang }
        403: { description: Mangler NAV-ident i token (saksbehandler kunne ikke utledes) }
        500: { $ref: '#/components/responses/ServerError' }
      security:
        - Bearer: []
  /noekkelinformasjon:
    get:
      tags: [ skattekort-admin ]
      summary: Hent nøkkelinformasjon
      description: |
        Returnerer aggregerte tall for adminoversikten.
        `antallAvHver` inneholder én nøkkel per `inntektsaar` (skattekort-antall) pluss `personer` (totalt antall personer).
      operationId: hentNoekkelinformasjon
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoekkelinformasjonResponse'
        401: { description: Ingen tilgang }
        500: { $ref: '#/components/responses/ServerError' }
      security:
        - Bearer: [ ]

components:
  responses:
    BadRequest:
      description: Ugyldig request, oppfyller ikke swagger-kontrakt
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServerError:
      description: Annen feil
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    WrappedAuditResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AuditResponse'
        errorMessage:
          type: string
          nullable: true
          example: null

    WrappedAuditError:
      type: object
      required: [data, errorMessage]
      properties:
        data:
          type: string
          example: ''
          description: Tom streng når kallet feiler pga. manglende rettigheter
        errorMessage:
          type: string
          example: 'Mangler rettigheter til å se informasjon!'
    NoekkelinformasjonResponse:
      type: object
      required: [antallAvHver]
      properties:
        antallAvHver:
          type: object
          description: |
            Map fra nøkkel til antall.
          additionalProperties:
            type: integer
            format: int32
            minimum: 0
          example:
            "2025": 3456789
            "2026": 2345678
            "2027": 1234567
            personer: 2030405
    BatchInsightRequest:
      type: object
      properties:
        tidspunktFom:
          type: string
          format: date-time
          nullable: true
          example: '2026-04-08T08:00:00Z'
          description: Start-tidspunkt
        tidspunktTom:
          type: string
          format: date-time
          nullable: true
          example: '2026-04-09T08:00:00Z'
          description: Slutt-tidspunkt

    BatchInsightResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Bestillingsbatch'

    Bestillingsbatch:
      type: object
      required:
        - id
        - status
        - type
        - bestillingsreferanse
        - oppdatert
        - opprettet
      properties:
        id:
          type: integer
          format: int64
          example: 12345
        status:
          type: string
          enum:
            - NY
            - FERDIG
            - FEILET
            - RETRY
        type:
          type: string
          enum:
            - BESTILLING
            - OPPDATERING
        bestillingsreferanse:
          type: string
          example: 'BR123456'
        oppdatert:
          type: string
          format: date-time
          example: '2026-04-09T08:32:14Z'
        opprettet:
          type: string
          format: date-time
          example: '2026-04-09T08:30:00Z'
        dataSendt:
          type: string
          nullable: true
          description: JSON-streng sendt til Skatteetaten
          example: '{"inntektsaar":"2026","bestillingstype":"HENT_ALLE_OPPGITTE"}'
        dataMottatt:
          type: string
          description: JSON-streng mottatt fra Skatteetaten
          nullable: true
          example: '{"status":"FORESPOERSEL_OK"}'
          
    BestillingResponse:
      type: object
      required: [ items ]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BestillingDTO'
          

    BestillingDTO:
      type: object
      required:
        - id                 
        - personId
        - fnr
        - inntektsaar
        - oppdatert
      properties:
        id:
          type: integer
          format: int64
          example: 4711 
        personId:
          type: integer
          format: int64
          example: 1
        fnr:
          type: string
          example: '01010112345'
          minLength: 11
          maxLength: 11
          pattern: '^\d{11}$'
        inntektsaar:
          type: integer
          format: int32
          example: 2026
        bestillingsbatchId:
          type: integer
          format: int64
          nullable: true
          example: 12345
        oppdatert:
          type: string
          format: date-time
          example: '2026-04-10T10:30:00Z'

    UtsendingResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UtsendingDTO'
          
    UtsendingDTO:
      type: object
      required:
        - id
        - fnr
        - inntektsaar
        - forsystem
        - failCount
        - opprettet
      properties:
        id:
          type: integer
          format: int64
          example: 9001
        fnr:
          type: string
          example: '01010112345'
          minLength: 11
          maxLength: 11
          pattern: '^\d{11}$'
        inntektsaar:
          type: integer
          format: int32
          example: 2026
        forsystem:
          $ref: '#/components/schemas/Forsystem'
        failCount:
          type: integer
          format: int32
          example: 0
          description: Antall mislykkede utsendingsforsøk
        failMessage:
          type: string
          nullable: true
          example: 'Tilkobling timet ut'
        opprettet:
          type: string
          format: date-time
          example: '2026-04-10T10:30:00Z'

    Forsystem:
      type: string
      description: Forsystem som utsendingen er knyttet til
      enum:
        - OS
        - OS_STOR
        - MANUELL
        - DARE_POC
    
    ApiError:
      type: object
      required: [timestamp, status, error, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
          description: Tidspunkt feilen oppsto
          example: '2026-04-29T10:32:14Z'
        status:
          type: integer
          example: 400
          description: HTTP status-kode
        error:
          type: string
          example: 'Bad Request'
          description: HTTP-statusens kort-navn (`HttpStatusCode.description`)
        message:
          type: string
          nullable: true
          example: 'Fnr må bestå av tall og være 11 tegn langt'
          description: Feilmelding fra årsaks-exception (kan være null hvis exception ikke har melding)
        path:
          type: string
          example: '/api/v1/admin/bestillingsbatcher'
          description: Endepunktet hvor feilen oppsto

    AuditResponse:
      type: object
      description: Returnerer audit-logg for alle fnr som er knyttet til samme person som oppgitt fnr
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Audit'

    Audit:
      type: object
      required:
        - id
        - personId
        - brukerId
        - opprettet
        - tag
      properties:
        id:
          type: integer
          format: int64
          example: 12345
          description: Audit ID
        personId:
          type: integer
          format: int64
          example: 1
          description: Person ID
        brukerId:
          type: string
          example: "F123456"
          description: Bruker ID som utførte handlingen
        opprettet:
          type: string
          format: date-time
          example: '2026-04-10T10:30:00Z'
          description: Når audit-entry ble opprettet
        tag:
          type: string
          enum:
            - BESTILLING_ETTERLATT
            - BESTILLING_FEILET
            - BESTILLING_SENDT
            - HENTING_AV_SKATTEKORT_FEILET
            - INVALID_FNR
            - MOTTATT_FORESPOERSEL
            - NYTT_FNR
            - OPPDATERT_PERSONIDENTIFIKATOR
            - OPPRETTET_PERSON
            - SKATTEKORTINFORMASJON_MOTTATT
            - SYNTETISERT_SKATTEKORT
            - UKJENT
            - UTSENDING_FEILET
            - UTSENDING_OK
            - UVENTET_PERSON
            - MANUELL
          description: Type audit-event
        informasjon:
          type: string
          nullable: true
          description: Informasjon

    FnrRequest:
      type: object
      required:
        - fnr
      properties:
        fnr:
          type: string
          example: "01010112345"
          minLength: 11
          maxLength: 11
          pattern: '^\d{11}$'
          description: Fødselsnummer

  securitySchemes:
    Bearer:
      type: apiKey
      description: |-
        OIDC-token (JWT via OAuth2.0).<br> 
          Følgende format må brukes i input-feltet "Value" under: <strong>\"Bearer {token}\"</strong>.<br> 
          Eksempel på verdi i input-felt: <strong>Bearer eYdmifml0ejugm</strong>
      name: Authorization
      in: header