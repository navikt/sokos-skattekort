openapi: '3.0.3'

info:
  version: 1.0.0
  title: sokos-skattekort API
  description: API-tjeneste for å hente ut skattekort på person for gjeldende år +/- 1 år som får ytelser i NAV
  contact:
    name: PO Utbetaling
    email: okonomi@nav.no
    url: https://nav-it.slack.com/archives/CKZADNFBP
servers:
  - url: /api/v1/person
tags:
  - name: skattekort
    description: Skattekort informasjon

paths:
  /hent-skattekort:
    post:
      tags:
        - skattekort
      summary: Hente skattekort for person
      description: Returnerer skattekort for person
      operationId: hentSkattekortPerson

      requestBody:
        description: fnr er påkrevd. Inntektåret må være gjeldende år +/- 1 år hvis det er oppgitt.
          Neste år kan kun benyttes fra og med 15. desember.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkattekortPersonRequest'
        required: true

      responses:
        200:
          description: OK - Hvis skattekort ikke finnes, returneres tom liste
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkattekortDTO'
        400:
          description: Ugyldig request, oppfyller ikke swagger-kontrakt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        401:
          description: Ingen tilgang
        500:
          description: Annen feil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

      security:
        - Bearer: [ ]
  
  /opprett:
    post:
      summary: Opprett fiktivt skattekort
      description: Oppretter fiktivt skattekort for person og inntektsår
      operationId: opprettSkattekort
      responses:
        201:
          description: OK - Skattekort er lagret
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkattekortDTO'
        400:
          description: Ugyldig request, oppfyller ikke swagger-kontrakt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        401:
          description: Ingen tilgang
        500:
          description: Annen feil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        description: fnr, inntektsaar er påkrevd. Inntektåret må være gjeldende år +/- 1 år.

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpprettSkattekortRequest'
        required: true
      security:
        - Bearer: [ ]
components:
  schemas:
    SkattekortPersonRequest:
      type: object
      properties:
        fnr:
          type: string
          nullable: false
          example: "12345678901"
        inntektsaar:
          type: integer
          format: int16
          nullable: true
          example: 2026

    OpprettSkattekortRequest:
      type: object
      properties:
        fnr:
          type: string
          nullable: false
          example: "12345678901"
        skattekort:
          $ref: '#/components/schemas/SkattekortDTO'
    SkattekortDTO:
      type: object
      properties:
        utstedtDato:
          type: string
          format: date
          nullable: true
        inntektsaar:
          type: integer
          format: year
          example: 2026
        resultatForSkattekort:
          type: string
          description: Result for skattekort
          enum:
            - skattekortopplysningerOK
            - ikkeSkattekort
            - ikkeTrekkplikt
        forskuddstrekkList:
          type: array
          items:
            $ref: '#/components/schemas/ForskuddstrekkDTO'
        tilleggsopplysningList:
          type: array
          items:
            type: string
            enum:
              - oppholdPaaSvalbard
              - kildeskattpensjonist
              - oppholdITiltakssone
              - kildeskattPaaLoenn
      required:
        - inntektsaar
        - forskuddstrekkList
        - tilleggsopplysningList

    ForskuddstrekkDTO:
      type: object
      description: Frikortbeløp vil overstyre tabell, som igjen overstyrer prosentsats.
        Oppgis tabell, må også antallMndForTrekk oppgis, eller brukes prosentsats.
      properties:
        trekkode:
          $ref: '#/components/schemas/Trekkode'
        frikortBeloep:
          type: integer
          nullable: true
          example: 50000
        tabell:
          type: string
          example: "8010"
        prosentSats:
          type: number
          format: double
          example: 25.5
        antallMndForTrekk:
          type: number
          format: double
          example: 10.5
    Trekkode:
      type: string
      enum:
        - loennFraNAV
        - pensjonFraNAV
        - ufoeretrygdFraNAV
    
    ApiError:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
          description: Tidspunkt feilen oppsto
        status:
          type: integer
          example: 4xx
          description: HTTP status kode
        error:
          type: string
          example: Error type
          description: En kort, lesbar oppsummering av problemet
        message:
          type: string
          example: Error message, invalid value
          description: En lesbar forklaring som er spesifikk for denne forekomsten av problemet
        path:
          type: string
          example: /api/v1/skattekort
          description: Endepunktet hvor feilen oppstå

  securitySchemes:
    Bearer:
      type: apiKey
      description: |-
        OIDC-token (JWT via OAuth2.0).<br> 
          Følgende format må brukes i input-feltet "Value" under: <strong>\"Bearer {token}\"</strong>.<br> 
          Eksempel på verdi i input-felt: <strong>Bearer eYdmifml0ejugm</strong>
      name: Authorization
      in: header