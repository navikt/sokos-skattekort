openapi: '3.0.3'

info:
  version: 1.0.0
  title: sokos-skattekort API
  description: API-tjeneste for å hente ut skattekort på person for gjeldende år +/- 1 år som får ytelser i NAV
  contact:
    name: PO Utbetaling
    email: okonomi@nav.no
    url: https://nav-it.slack.com/archives/CKZADNFBP
servers:
  - url: /api/v1/person
tags:
  - name: skattekort
    description: Skattekort informasjon

paths:
  /hent-skattekort:
    post:
      tags:
        - skattekort
      summary: Hente skattekort for person
      description: Returnerer skattekort for person
      operationId: hentSkattekortPerson

      requestBody:
        description: fnr og inntektsaar er påkrevd. Inntektåret må være gjeldende år +/- 1 år
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkattekortPersonRequest'
        required: true

      responses:
        200:
          description: OK - Hvis skattekort ikke finnes, returneres tom liste
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkattekortDTO'
        400:
          description: Ugyldig request, oppfyller ikke swagger-kontrakt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        401:
          description: Ingen tilgang
        500:
          description: Annen feil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

      security:
        - Bearer: [ ]
  
  /opprett:
    post:
      summary: Opprett fiktivt skattekort
      description: Oppretter fiktivt skattekort for person og inntektsår
      operationId: opprettSkattekort
      responses:
        201:
          description: OK - Skattekort er lagret
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkattekortDTO'
        400:
          description: Ugyldig request, oppfyller ikke swagger-kontrakt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        401:
          description: Ingen tilgang
        500:
          description: Annen feil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        501:
          description: Fordi den er ikke laget ennå
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        description: fnr og inntektsaar er påkrevd. Inntektåret må være gjeldende år +/- 1 år
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpprettSkattekortRequest'
        required: true
      security:
        - Bearer: [ ]
components:
  schemas:
    SkattekortPersonRequest:
      type: object
      properties:
        fnr:
          type: string
          nullable: false
        inntektsaar:
          type: integer
          format: int16
          nullable: true

    OpprettSkattekortRequest:
      type: object
      properties:
        fnr:
          type: string
          nullable: false
        skattekort:
          $ref: '#/components/schemas/SkattekortDTO'
    SkattekortDTO:
      type: object
      properties:
        utstedtDato:
          type: string
          format: date
          nullable: true
        identifikator:
          type: string
          nullable: true
        inntektsaar:
          type: integer
        kilde:
          type: string
          description: Hvor kommer skattekortet fra?
          enum:
            - skatteetaten
            - syntetisert
            - dolly
        resultatForSkattekort:
          type: string
        forskuddstrekkList:
          type: array
          items:
            $ref: '#/components/schemas/ForskuddstrekkDTO'
        tilleggsopplysningList:
          type: array
          items:
            $ref: '#/components/schemas/Tilleggsopplysning'
      required:
        - inntektsaar
        - forskuddstrekkList
        - tilleggsopplysningList
    
    ResultatForSkattekort:
      type: string
      description: Result for skattekort
      enum:
        - ikkeSkattekort
        - ikkeTrekkplikt
        - skattekortopplysningerOK
        - ugyldigOrganisasjonsnummer
        - ugyldigFoedselsEllerDnummer
        - utgaattDnummerSkattekortForFoedselsnummerErLevert

    Tilleggsopplysning:
      type: string
      items:
        enum:
          - oppholdPaaSvalbard
          - kildeskattpensjonist
          - oppholdITiltakssone
          - kildeskattPaaLoenn

    ForskuddstrekkDTO:
      type: object
      properties:
        trekkode:
          $ref: '#/components/schemas/Trekkode'
        frikortBeloep:
          type: integer
          nullable: true
        tabellNummer:
          type: string
        prosentSats:
          type: number
          format: double
        antallMndForTrekk:
          type: number
          format: double
    Trekkode:
      type: string
      description: Trekkode for forskuddstrekk
      enum:
        - loennFraNAV
        - pensjonFraNAV
        - ufoeretrygdFraNAV
    
    ApiError:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
          description: Tidspunkt feilen oppsto
        status:
          type: integer
          example: 4xx
          description: HTTP status kode
        error:
          type: string
          example: Error type
          description: En kort, lesbar oppsummering av problemet
        message:
          type: string
          example: Error message, invalid value
          description: En lesbar forklaring som er spesifikk for denne forekomsten av problemet
        path:
          type: string
          example: /api/v1/skattekort
          description: Endepunktet hvor feilen oppstå

  securitySchemes:
    Bearer:
      type: apiKey
      description: |-
        OIDC-token (JWT via OAuth2.0).<br> 
          Følgende format må brukes i input-feltet "Value" under: <strong>\"Bearer {token}\"</strong>.<br> 
          Eksempel på verdi i input-felt: <strong>Bearer eYdmifml0ejugm</strong>
      name: Authorization
      in: header